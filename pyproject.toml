[project]
name = "api-usuarios"
version = "2.0.0"
description = "API REST de gestão de usuários (FastAPI): JWT, RBAC, auditoria e import/export JSON"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 90
