name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Auditoria de dependências (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-usuarios .
      - name: Subir container e testar endpoints
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e ADMIN_PASSWORD=Admin1234 \
            api-usuarios
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break || sleep 1
          done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/ready
          curl -fs -X POST http://localhost:8000/auth/login \
            -d 'username=admin&password=Admin1234' | grep -q access_token
      - name: Logs do container
        if: always()
        run: docker logs api
