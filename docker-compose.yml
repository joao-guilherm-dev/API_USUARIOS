services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: usuarios
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios -d usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env (>= 32 caracteres)}
      DATABASE_URL: postgresql+psycopg://usuarios:${POSTGRES_PASSWORD}@db:5432/usuarios
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
